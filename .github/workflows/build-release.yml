name: Build & Release Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            py: '3.11'
            ext: '.exe'
            platform: 'windows'
          - os: ubuntu-latest
            py: '3.11'
            ext: ''
            platform: 'linux'
          - os: macos-latest
            py: '3.11'
            ext: ''
            platform: 'macos'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        shell: cmd
        run: call build.bat

      - name: Build (Linux/macOS)
        if: matrix.platform != 'windows'
        shell: bash
        run: bash build.sh

      - name: Rename artifact with platform
        shell: bash
        run: |
          cd dist
          # Use ASCII-only name to avoid encoding issues on CI runners
          new_name="PersonalDebugConsole-${GITHUB_REF_NAME:-v1.0.0}-${{ matrix.platform }}${{ matrix.ext }}"
          for f in *; do
            mv "$f" "$new_name" 2>/dev/null || true
            break
          done
          echo "ARTIFACT=$new_name" >> "$GITHUB_ENV"
          ls -lh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersonalDebugConsole-${{ matrix.platform }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Display structure
        run: ls -R artifacts
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
